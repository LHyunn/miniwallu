<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 · 미니월루천국</title>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-card {
    width: min(400px, 94vw);
    text-align: center;
  }

  .login-card .mark {
    font-family: var(--font-display);
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .login-card .mark b { color: var(--accent); }

  .login-card h1 {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 800;
    margin: 10px 0 4px;
  }

  .login-card p.hint {
    font-size: 13.5px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .login-card .mw-input { margin-bottom: 12px; }

  .login-card .mw-btn { margin-bottom: 10px; }

  .login-card .kakao {
    opacity: 0.45;
    pointer-events: none;
  }

  #status {
    min-height: 1.4em;
    font-size: 13px;
    color: var(--gold);
    margin-top: 6px;
  }

  .back {
    display: inline-block;
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--muted);
    border-bottom: 1px dotted var(--muted);
  }

  /* 위장 면: "문서 열기" 자격 증명 다이얼로그 톤 */
  body.stealth { background: var(--bg-deep); }

  body.stealth .login-card {
    border-radius: 6px;
    padding: 0 0 20px;
    overflow: hidden;
  }

  body.stealth .login-card::before {
    content: "문서 열기 — 자격 증명 필요";
    display: block;
    text-align: left;
    padding: 9px 14px;
    margin-bottom: 18px;
    background: var(--bg-deep);
    border-bottom: 1px solid var(--panel-border);
    font-size: 13px;
    font-weight: 600;
  }

  body.stealth .login-card > * { margin-left: 20px; margin-right: 20px; }

  body.stealth .login-card .mark,
  body.stealth .login-card h1 { display: none; }

  body.stealth .mw-btn {
    border-radius: 4px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-weight: 600;
  }
</style>
</head>
<body>
<script>
  document.body.dataset.theme = localStorage.getItem("mw:theme") === "dark" ? "dark" : "light";
  var _s = localStorage.getItem("mw:stealth");
  if (_s == null) _s = localStorage.getItem("tichu-stealth");
  document.body.classList.toggle("stealth", _s !== "0");
</script>

<div class="mw-card login-card">
  <div class="mark"><b>▦</b> 미니월루천국</div>
  <h1>어서 오세요</h1>
  <p class="hint">닉네임을 정하고 들어오면 전적이 계정에 쌓입니다.</p>
  <input id="nickname" class="mw-input" maxlength="12" placeholder="닉네임" autocomplete="off">
  <button id="btn-google" class="mw-btn">구글로 로그인</button>
  <button id="btn-anon" class="mw-btn ghost">게스트로 입장</button>
  <button class="mw-btn ghost kakao">카카오 (준비 중)</button>
  <div id="status"></div>
  <a class="back" href="/">← 첫 화면으로</a>
</div>

<script type="module">
  import {
    getSession, getProfile, signInGoogle, signInAnon, ensureProfile, safeNext, PENDING_NICK_KEY,
  } from "/assets/js/auth.js";

  const el = (id) => document.getElementById(id);
  const next = safeNext(new URLSearchParams(location.search).get("next"));
  const go = () => location.replace(next);
  const setStatus = (msg) => (el("status").textContent = msg);

  // 이미 로그인 + 프로필 보유 → 로그인 페이지가 걸림돌이 되지 않게 즉시 통과
  const {
    data: { session },
  } = await getSession();

  if (session) {
    const profile = await getProfile(session.user.id);
    if (profile) {
      go();
    } else {
      // 구글 OAuth 왕복 복귀 등 — 보관해둔 닉네임이 있으면 프로필 생성 후 통과
      const pending = sessionStorage.getItem(PENDING_NICK_KEY);
      if (pending) {
        sessionStorage.removeItem(PENDING_NICK_KEY);
        try {
          await ensureProfile(pending);
          go();
        } catch (e) {
          setStatus(String(e));
        }
      } else {
        setStatus("닉네임을 정하고 '게스트로 입장'을 눌러 마무리하세요.");
      }
    }
  }

  el("btn-anon").addEventListener("click", async () => {
    const nickname = el("nickname").value.trim();
    if (!nickname) return setStatus("닉네임을 입력해주세요.");
    try {
      const {
        data: { session: cur },
      } = await getSession();
      if (!cur) {
        const { error } = await signInAnon();
        if (error) throw error.message;
      }
      await ensureProfile(nickname);
      go();
    } catch (e) {
      setStatus(String(e));
    }
  });

  el("btn-google").addEventListener("click", async () => {
    // 닉네임은 선택 — 기존 구글 계정이면 프로필이 이미 있다. 새 계정이면 복귀 후 만든다.
    const nickname = el("nickname").value.trim();
    if (nickname) sessionStorage.setItem(PENDING_NICK_KEY, nickname);
    try {
      const { error } = await signInGoogle(next);
      if (error) throw error.message;
    } catch (e) {
      setStatus(String(e));
    }
  });
</script>
</body>
</html>

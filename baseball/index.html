<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숫자야구</title>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/chrome.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="stealth.css">
</head>
<body>
<script>
  document.body.dataset.theme = localStorage.getItem("mw:theme") === "light" ? "light" : "dark";
  document.body.classList.toggle("stealth", (localStorage.getItem("mw:stealth") ?? "1") !== "0");
</script>

<div id="app">
  <header>
    <h1><a href="/">미니월루천국</a> · <span class="brand-accent">숫자야구</span></h1>
    <button id="btn-stealth" class="mw-iconbtn" title="위장 전환">👔</button>
    <button id="btn-theme" class="mw-iconbtn" title="테마 전환">🌙</button>
  </header>

  <section id="screen-connect" class="screen hidden">
    <div id="resume-area" class="mw-card hidden">
      <h2>진행 중인 게임</h2>
      <p class="hint" id="resume-info"></p>
      <button id="btn-resume" class="mw-btn gold">이어하기</button>
    </div>
    <div class="mw-card">
      <h2>방 만들기</h2>
      <p class="hint">방을 만들고 코드를 친구에게 알려주세요.</p>
      <button id="btn-create" class="mw-btn">방 만들기</button>
    </div>
    <div class="divider">또는</div>
    <div class="mw-card">
      <h2>입장하기</h2>
      <input id="join-code" class="mw-input" maxlength="4" placeholder="코드 4자리" autocomplete="off">
      <button id="btn-join" class="mw-btn ghost">입장하기</button>
    </div>
    <p id="connect-status" class="status"></p>
  </section>

  <section id="screen-lobby" class="screen hidden">
    <div class="mw-card">
      <h2>대기실</h2>
      <p class="hint">방 코드</p>
      <div id="lobby-code" class="code"></div>
      <div id="lobby-seats">
        <div class="seat" data-seat="0"><span class="seat-name">빈 자리</span></div>
        <div class="vs">vs</div>
        <div class="seat" data-seat="1"><span class="seat-name">빈 자리</span></div>
      </div>
      <button id="btn-start" class="mw-btn" disabled>게임 시작</button>
      <p id="lobby-status" class="status"></p>
    </div>
    <div class="mw-card" id="room-settings">
      <h2>방 설정</h2>
      <label class="hint" for="set-digits">자릿수</label>
      <select id="set-digits" class="mw-input">
        <option value="3">3자리</option>
        <option value="4" selected>4자리</option>
        <option value="5">5자리</option>
      </select>
      <label class="hint" for="set-target">목표 승수</label>
      <select id="set-target" class="mw-input">
        <option value="1">1선승</option>
        <option value="3" selected>3선승</option>
        <option value="5">5선승</option>
      </select>
      <p id="settings-owner-hint" class="hint hidden">방장만 변경할 수 있어요</p>
    </div>
  </section>

  <section id="screen-game" class="screen hidden">
    <div id="game-normal">
      <div id="scoreline"></div>
      <div id="status-line"></div>

      <!-- 비밀 설정 단계 -->
      <div id="secret-phase" class="hidden">
        <p class="hint" id="secret-hint"></p>
        <div class="input-row">
          <input id="secret-input" class="mw-input num" inputmode="numeric" autocomplete="off">
          <button id="btn-secret" class="mw-btn">확정</button>
        </div>
      </div>

      <!-- 추측 단계 -->
      <div id="play-phase" class="hidden">
        <div id="my-secret-line"></div>
        <div id="histories">
          <div class="hist">
            <h3>내 추측</h3>
            <div id="hist-mine" class="hist-body"></div>
          </div>
          <div class="hist">
            <h3 id="opp-hist-title">상대 추측</h3>
            <div id="hist-opp" class="hist-body"></div>
          </div>
        </div>
        <div class="input-row" id="guess-row">
          <input id="guess-input" class="mw-input num" inputmode="numeric" autocomplete="off">
          <button id="btn-guess" class="mw-btn">추측</button>
        </div>
      </div>
    </div>

    <div id="round-end" class="overlay hidden">
      <div class="mw-card">
        <h2 id="round-end-title"></h2>
        <div id="round-end-body"></div>
        <button id="btn-next-round" class="mw-btn gold">다음 판</button>
        <p id="next-wait" class="hint hidden">상대를 기다리는 중...</p>
      </div>
    </div>

    <div id="match-end" class="overlay hidden">
      <div class="mw-card">
        <h2>게임 종료</h2>
        <div id="match-result"></div>
        <a class="mw-btn ghost" href="/stats/">전적 보기</a>
        <button id="btn-new-game" class="mw-btn gold">새 게임</button>
      </div>
    </div>
  </section>
</div>

<script type="module" src="app.js"></script>
</body>
</html>

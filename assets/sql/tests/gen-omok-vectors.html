<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오목 패리티 벡터 생성기</title>
<style>
* { box-sizing: border-box; }

body {
  --bg: #f3f4f6;
  --panel: #ffffff;
  --panel-border: #d9dce1;
  --text: #1f2328;
  --muted: #6b7280;
  --accent: #3b6fd4;
  --ok-bg: #c6efce;
  --ok-tx: #276b24;
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
}

#wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 4px; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 16px; line-height: 1.6; }

fieldset {
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  background: var(--panel);
  padding: 12px 16px 16px;
  margin: 0 0 16px;
}
legend { font-size: 13px; color: var(--muted); padding: 0 6px; }

label { font-size: 13px; margin-right: 16px; display: inline-block; }
input[type="number"] { width: 90px; padding: 4px 6px; font-size: 13px; }

button {
  padding: 8px 16px;
  font-size: 14px;
  font-weight: 600;
  border: 1px solid var(--accent);
  border-radius: 6px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
}
button[disabled] { opacity: .5; cursor: default; }
button.ghost { background: transparent; color: var(--accent); }

#status { font-size: 13px; margin: 12px 0; min-height: 20px; }
#status.done { display: inline-block; padding: 8px 14px; border-radius: 8px; background: var(--ok-bg); color: var(--ok-tx); font-weight: 600; }

table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--panel-border); font-size: 13px; }
th { color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: none; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }

textarea {
  width: 100%;
  height: 340px;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 11px;
  padding: 8px;
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
}
</style>
</head>
<body>
<div id="wrap">
  <h1>오목 패리티 벡터 생성기</h1>
  <p class="hint">
    <code>/omok/rules.js</code>로 랜덤 자가대국을 돌려 (국면, 좌표, 승리여부, 금수종류) 벡터를 뽑고,
    <code>omok_rules_tests.sql</code>의 <strong>B파트</strong>에 붙여넣을 INSERT 문으로 출력합니다.
    벡터는 모두 <strong>“흑이 (r,c)에 둔다”</strong> 전제이며, 금수/승리가 난 국면은 전량 담고 평범한 국면은 무작위 표본으로 채웁니다.
    출력이 <code>_t_board(array[흑], array[백])</code> 헬퍼를 쓰므로(용량 절약) 반드시 omok_rules_tests.sql 안에서 실행해야 합니다.
  </p>

  <fieldset>
    <legend>설정</legend>
    <label>자가대국 판수 <input id="games" type="number" value="300" min="1" max="5000"></label>
    <label>목표 벡터 수 <input id="target" type="number" value="3000" min="100" max="20000"></label>
    <label>판당 표본 좌표 <input id="perply" type="number" value="12" min="1" max="60"></label>
    <label>난수 시드 <input id="seed" type="number" value="20260818" min="1"></label>
    <div style="margin-top:12px">
      <button id="run">생성</button>
      <button id="copy" class="ghost" disabled>SQL 복사</button>
    </div>
  </fieldset>

  <div id="status"></div>

  <table>
    <thead><tr><th>유형</th><th style="width:110px">발견</th><th style="width:110px">출력</th></tr></thead>
    <tbody id="counts"></tbody>
  </table>

  <textarea id="out" readonly placeholder="생성을 누르면 여기에 INSERT 문이 나옵니다."></textarea>
</div>

<script type="module">
// 이 파일은 /assets/sql/tests/ 에 있으므로 rules.js는 세 단계 위다.
// (사이트 루트로 서빙 중이라면 '/omok/rules.js' 절대경로도 동일하게 동작한다.)
import { SIZE, BLACK, WHITE, checkWin, isForbidden } from '../../../omok/rules.js';

// JS의 한글 금수 이름 → SQL(_ob_forbidden)의 코드. 이 매핑이 패리티의 계약이다.
const FORB_CODE = { '장목': 'overline', '사사': 'double-four', '삼삼': 'double-three' };

// 재현 가능한 난수(mulberry32) — 불일치가 나오면 같은 시드로 그대로 재현할 수 있다.
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function mk() {
  return Array.from({ length: SIZE }, () => new Array(SIZE).fill(0));
}

// 기존 돌에서 체비셰프 거리 d 이내의 빈 칸(=위협이 생기는 구역). 판이 비었으면 중앙.
function candidates(bd, d) {
  const out = [];
  let any = false;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (bd[r][c] !== 0) { any = true; continue; }
      let near = false;
      for (let dr = -d; dr <= d && !near; dr++) {
        for (let dc = -d; dc <= d; dc++) {
          const rr = r + dr, cc = c + dc;
          if (rr < 0 || rr >= SIZE || cc < 0 || cc >= SIZE) continue;
          if (bd[rr][cc] !== 0) { near = true; break; }
        }
      }
      if (near) out.push([r, c]);
    }
  }
  if (!any) return [[7, 7]];
  return out;
}

function stoneLists(bd) {
  const black = [], white = [];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (bd[r][c] === BLACK) black.push(r * SIZE + c + 1);
      else if (bd[r][c] === WHITE) white.push(r * SIZE + c + 1);
    }
  }
  return { black, white };
}

const TYPES = ['overline', 'double-four', 'double-three', 'win', 'plain'];

function classify(win, forbCode) {
  if (forbCode) return forbCode;
  return win ? 'win' : 'plain';
}

function sqlLiteral(v) {
  const { black, white } = v.stones;
  return `(_t_board(array[${black.join(',')}]::int[], array[${white.join(',')}]::int[]), `
    + `${v.r}, ${v.c}, ${v.win ? 'true' : 'false'}, ${v.forb ? `'${v.forb}'` : 'null'})`;
}

async function generate() {
  const nGames = Math.max(1, parseInt(document.getElementById('games').value, 10) || 300);
  const target = Math.max(100, parseInt(document.getElementById('target').value, 10) || 3000);
  const perPly = Math.max(1, parseInt(document.getElementById('perply').value, 10) || 12);
  const seed = Math.max(1, parseInt(document.getElementById('seed').value, 10) || 1);
  const rnd = rng(seed);

  const found = Object.fromEntries(TYPES.map((t) => [t, 0]));
  const specials = [];   // 금수 또는 승리 국면 — 전량 보관
  const plains = [];     // 평범한 국면 — 표본
  const status = document.getElementById('status');
  status.className = '';

  for (let g = 0; g < nGames; g++) {
    const bd = mk();
    let color = BLACK;

    for (let ply = 0; ply < SIZE * SIZE; ply++) {
      const zone = candidates(bd, 1);           // 벡터 표본은 돌에 붙은 칸에서만(위협 밀집 구역)
      const play = candidates(bd, 2);           // 실제 착수는 조금 더 넓게
      if (play.length === 0) break;

      // --- 벡터 수집: 후보 좌표를 흑 관점으로 판정 ---
      const stones = stoneLists(bd);            // 이 시점 국면은 한 번만 직렬화해 공유
      const picks = Math.min(perPly, zone.length);
      for (let i = 0; i < picks; i++) {
        const [r, c] = zone[Math.floor(rnd() * zone.length)];
        const forb = FORB_CODE[isForbidden(bd, r, c)] || null;
        bd[r][c] = BLACK;
        const win = checkWin(bd, r, c) !== null;
        bd[r][c] = 0;
        const kind = classify(win, forb);
        found[kind]++;
        const vec = { stones, r, c, win, forb };
        if (kind === 'plain') plains.push(vec); else specials.push(vec);
      }

      // --- 실제 착수: 흑은 금수 자리를 두지 않는다(단 5가 완성되면 isForbidden이 null) ---
      const legal = color === BLACK ? play.filter(([r, c]) => isForbidden(bd, r, c) === null) : play;
      if (legal.length === 0) break;
      const [mr, mc] = legal[Math.floor(rnd() * legal.length)];
      bd[mr][mc] = color;
      if (checkWin(bd, mr, mc)) break;          // 승부가 났으면 다음 판으로
      color = color === BLACK ? WHITE : BLACK;
    }

    if (g % 10 === 0) {
      status.textContent = `자가대국 ${g + 1}/${nGames} — 특수 ${specials.length}건, 일반 ${plains.length}건`;
      await new Promise((res) => setTimeout(res, 0)); // UI 갱신 양보
    }
  }

  // --- 출력 구성: 특수 국면 우선, 남는 자리를 일반 표본으로 채운다 ---
  const shuffle = (arr) => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };
  const specialQuota = Math.min(specials.length, Math.floor(target * 0.7));
  const picked = shuffle(specials).slice(0, specialQuota)
    .concat(shuffle(plains).slice(0, Math.max(0, target - specialQuota)));
  shuffle(picked);

  const emitted = Object.fromEntries(TYPES.map((t) => [t, 0]));
  for (const v of picked) emitted[classify(v.win, v.forb)]++;

  const rows = document.getElementById('counts');
  rows.textContent = '';
  for (const t of TYPES) {
    const tr = document.createElement('tr');
    const td1 = document.createElement('td'); td1.textContent = t;
    const td2 = document.createElement('td'); td2.className = 'num'; td2.textContent = found[t].toLocaleString();
    const td3 = document.createElement('td'); td3.className = 'num'; td3.textContent = emitted[t].toLocaleString();
    tr.append(td1, td2, td3);
    rows.appendChild(tr);
  }

  // 250행씩 끊어 여러 개의 INSERT 문으로 출력한다(SQL Editor 입력 한도 대비 — 문 단위로 나눠 붙일 수 있다).
  const CHUNK = 250;
  const parts = [
    `-- gen-omok-vectors.html 출력 — seed=${seed}, games=${nGames}, perPly=${perPly}, 총 ${picked.length}건`,
    `-- 유형별: ${TYPES.map((t) => `${t}=${emitted[t]}`).join(', ')}`,
    `-- 반드시 omok_rules_tests.sql의 B파트 자리에 붙여넣을 것(_t_board 헬퍼가 필요하다).`,
  ];
  for (let i = 0; i < picked.length; i += CHUNK) {
    const chunk = picked.slice(i, i + CHUNK);
    parts.push(
      'insert into _t_omok_vectors (cells, r, c, expect_win, expect_forbidden) values\n'
      + chunk.map(sqlLiteral).join(',\n') + ';'
    );
  }
  document.getElementById('out').value = parts.join('\n\n') + '\n';

  const missing = TYPES.filter((t) => emitted[t] === 0);
  status.className = 'done';
  status.textContent = `${picked.length.toLocaleString()}건 생성 완료`
    + (missing.length ? ` — 주의: ${missing.join('/')} 유형이 0건이다(판수를 늘려 다시 생성할 것)` : ' — 5개 유형 모두 포함');
  document.getElementById('copy').disabled = false;
}

document.getElementById('run').addEventListener('click', async (e) => {
  e.target.disabled = true;
  document.getElementById('copy').disabled = true;
  try {
    await generate();
  } catch (err) {
    const status = document.getElementById('status');
    status.className = '';
    status.textContent = `실패: ${err.message}`;
  } finally {
    e.target.disabled = false;
  }
});

document.getElementById('copy').addEventListener('click', async () => {
  const out = document.getElementById('out');
  out.select();
  try {
    await navigator.clipboard.writeText(out.value);
    document.getElementById('status').textContent = 'SQL을 클립보드에 복사했다.';
  } catch {
    document.execCommand('copy'); // 클립보드 API가 막힌 환경(파일 프로토콜 등) 폴백
  }
});
</script>
</body>
</html>
